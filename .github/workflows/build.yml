name: Build AutoUnwrap

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install mingw -y --no-progress

          gcc --version
          g++ --version
          windres --version

      - name: Build AutoUnwrap.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force dist | Out-Null

          Write-Host "=== Building Windows resource ==="
          windres src/resource.rc -O coff -o resource.o

          if ($LASTEXITCODE -ne 0) {
            throw "windres failed with exit code $LASTEXITCODE"
          }

          if (!(Test-Path "resource.o")) {
            throw "resource.o was not created"
          }

          Write-Host "=== Compiling AutoUnwrap ==="

          g++ `
            -std=c++17 `
            -O2 `
            -mwindows `
            -municode `
            -DUNICODE `
            -D_UNICODE `
            src/main.cpp `
            resource.o `
            -o "dist/AutoUnwrap.exe" `
            -static-libgcc `
            -static-libstdc++ `
            -lshell32 `
            -lcomdlg32 `
            -lcrypt32 `
            -lcomctl32 `
            -lole32 `
            -luuid `
            -ladvapi32 `
            -lgdi32 `
            -luser32

          if ($LASTEXITCODE -ne 0) {
            throw "g++ failed with exit code $LASTEXITCODE"
          }

          if (!(Test-Path "dist/AutoUnwrap.exe")) {
            throw "Build failed: AutoUnwrap.exe was not created"
          }

          Write-Host "=== Build successful ==="
          Get-Item "dist/AutoUnwrap.exe" | Select-Object Name, Length, FullName

      - name: Collect runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $gccPath = (Get-Command g++.exe).Source
          $mingwBin = Split-Path $gccPath

          Write-Host "MinGW bin directory: $mingwBin"

          $dlls = @(
            "libwinpthread-1.dll",
            "libgcc_s_seh-1.dll",
            "libstdc++-6.dll"
          )

          foreach ($dll in $dlls) {
            $source = Join-Path $mingwBin $dll

            if (Test-Path $source) {
              Write-Host "Copying $dll"
              Copy-Item $source "dist\$dll" -Force
            }
            else {
              Write-Host "$dll not found; skipping"
            }
          }

          Write-Host "=== Runtime package contents ==="
          Get-ChildItem dist

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\*" `
            -DestinationPath "AutoUnwrap-Windows-x64.zip" `
            -Force

      - name: Upload AutoUnwrap
        uses: actions/upload-artifact@v4
        with:
          name: AutoUnwrap-Windows-x64
          path: AutoUnwrap-Windows-x64.zip
          if-no-files-found: error
