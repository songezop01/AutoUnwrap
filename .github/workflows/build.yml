name: Build AutoUnwrap

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install mingw -y --no-progress
          $gcc = Get-ChildItem "C:\ProgramData\mingw64\mingw64\bin" -ErrorAction SilentlyContinue
          if ($gcc) { $env:Path = "C:\ProgramData\mingw64\mingw64\bin;" + $env:Path }
          $gcc2 = Get-ChildItem "C:\mingw64\bin" -ErrorAction SilentlyContinue
          if ($gcc2) { $env:Path = "C:\mingw64\bin;" + $env:Path }
          where.exe g++
          where.exe windres
          g++ --version
          windres --version

      - name: Build AutoUnwrap.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "dist" | Out-Null

          windres "src/resource.rc" -O coff -o "resource.o"
          if ($LASTEXITCODE -ne 0) { throw "windres failed with exit code $LASTEXITCODE" }

          g++ `
            -std=c++17 `
            -O2 `
            -mwindows `
            -municode `
            -DUNICODE `
            -D_UNICODE `
            "src/main.cpp" "resource.o" `
            -o "dist/AutoUnwrap.exe" `
            -static-libgcc `
            -static-libstdc++ `
            -lshell32 `
            -lcomdlg32 `
            -lcrypt32 `
            -lcomctl32 `
            -lole32 `
            -luuid `
            -ladvapi32 `
            -lgdi32 `
            -luser32

          if ($LASTEXITCODE -ne 0) { throw "g++ failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "dist/AutoUnwrap.exe")) { throw "Build failed: AutoUnwrap.exe was not created" }
          Get-Item "dist/AutoUnwrap.exe" | Select-Object Name,Length,FullName

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist/AutoUnwrap.exe" -DestinationPath "AutoUnwrap-Windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoUnwrap-Windows-x64
          path: AutoUnwrap-Windows-x64.zip
          if-no-files-found: error
