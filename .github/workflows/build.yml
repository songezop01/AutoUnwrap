name: Build AutoUnwrap

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install mingw -y --no-progress

          $env:Path += ";C:\ProgramData\mingw64\mingw64\bin"
          $env:Path += ";C:\mingw64\bin"

          gcc --version
          g++ --version
          windres --version

      - name: Build AutoUnwrap.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force dist | Out-Null

          Write-Host "=== Building Windows resource ==="

          windres src/resource.rc -O coff -o resource.o

          if (!(Test-Path "resource.o")) {
            throw "resource.o was not created"
          }

          Write-Host "=== Compiling AutoUnwrap ==="

          g++ `
            -std=c++17 `
            -O2 `
            -mwindows `
            -municode `
            -DUNICODE `
            -D_UNICODE `
            src/main.cpp `
            resource.o `
            -o "dist/AutoUnwrap.exe" `
            -static-libgcc `
            -static-libstdc++ `
            -static `
            -lshell32 `
            -lcomdlg32 `
            -lcrypt32 `
            -lcomctl32 `
            -lole32 `
            -luuid `
            -ladvapi32 `
            -lgdi32 `
            -luser32

          if (!(Test-Path "dist/AutoUnwrap.exe")) {
            throw "Build failed: AutoUnwrap.exe was not created"
          }

          Write-Host "=== Build successful ==="

          Get-Item "dist/AutoUnwrap.exe" |
            Select-Object Name, Length, FullName

      - name: Verify executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-Item "dist/AutoUnwrap.exe"

          if ($exe.Length -lt 100000) {
            throw "AutoUnwrap.exe looks suspiciously small"
          }

          Write-Host "EXE size:" $exe.Length "bytes"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/AutoUnwrap.exe" `
            -DestinationPath "AutoUnwrap-Windows-x64.zip" `
            -Force

      - name: Upload AutoUnwrap
        uses: actions/upload-artifact@v4
        with:
          name: AutoUnwrap-Windows-x64
          path: AutoUnwrap-Windows-x64.zip
          if-no-files-found: error
